name: cycani-probe
on: workflow_dispatch
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: curl cycani
        run: |
          echo "IP: $(curl -s https://ipinfo.io/json | head -c 200)"
          echo "status: $(curl -s -o /dev/null -w '%{http_code}' -H 'X-App-Name: cyc_web' -H 'User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) Chrome/120.0' 'https://www.cycani.org/api/videos/3945')"
          curl -s -H 'X-App-Name: cyc_web' -H 'User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) Chrome/120.0' 'https://www.cycani.org/api/videos/3945' | head -c 300
