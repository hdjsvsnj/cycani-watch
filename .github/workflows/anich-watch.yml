name: anich-watch
on:
  schedule:
    - cron: "3,8,13,18,23,28,33,38,43,48,53,58 * * * *"
  workflow_dispatch:
    inputs:
      test_mail:
        description: "发一封测试邮件验证链路"
        required: false
        default: "0"
      force_report:
        description: "无论有无更新都发一封巡检结果邮件"
        required: false
        default: "0"
permissions:
  contents: write
concurrency:
  group: anich-watch
  cancel-in-progress: false
jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 巡检
        env:
          ANICH_USER: ${{ secrets.ANICH_USER }}
          ANICH_PASS: ${{ secrets.ANICH_PASS }}
          SMTP_USER: ${{ secrets.CYCANI_SMTP_USER }}
          SMTP_PASS: ${{ secrets.CYCANI_SMTP_PASS }}
          MAIL_TO: ${{ secrets.CYCANI_MAIL_TO }}
          TEST_MAIL: ${{ inputs.test_mail || '0' }}
          FORCE_REPORT: ${{ inputs.force_report || '0' }}
        run: python3 anich/anich_watch.py
      - name: 顺带查中通签收
        continue-on-error: true
        env:
          KD100_CUSTOMER: ${{ secrets.KD100_CUSTOMER }}
          KD100_KEY: ${{ secrets.KD100_KEY }}
          ZTO_WAYBILL: ${{ secrets.ZTO_WAYBILL }}
          ZTO_PHONE: ${{ secrets.ZTO_PHONE }}
          SMTP_USER: ${{ secrets.CYCANI_SMTP_USER }}
          SMTP_PASS: ${{ secrets.CYCANI_SMTP_PASS }}
          MAIL_TO: ${{ secrets.CYCANI_MAIL_TO }}
          ZTO_MIN_INTERVAL: "900"
        run: python3 zto/zto_watch.py
      - name: 提交基线
        if: always()
        continue-on-error: true
        run: |
          git config user.name "anich-bot"
          git config user.email "bot@users.noreply.github.com"
          git pull --rebase --autostash origin main || true
          git add -A anich zto 2>/dev/null || true
          if ! git diff --quiet --cached; then
            git commit -m "chore: anich baseline / zto track" || true
            git push origin main || true
          fi
