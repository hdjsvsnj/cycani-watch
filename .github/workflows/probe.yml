name: probe-anich
on:
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: probe
        run: |
          echo "counts:"; curl -s -o /tmp/i.txt -w "%{http_code}" -A "Mozilla/5.0 (Linux; Android 14) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0 Mobile Safari/537.36" -H "Accept: application/json" https://anich.sends.eu.org/counts; echo; head -c 200 /tmp/i.txt; echo
          echo "login:"; curl -s -o /tmp/l.txt -w "%{http_code}" -A "Mozilla/5.0" -H "Content-Type: application/x-www-form-urlencoded" --data "data=10,16,116,101,115,116,64,101,120,97,109,112,108,101,46,99,111,109,18,1,120" https://anich.sends.eu.org/login; echo; head -c 200 /tmp/l.txt; echo