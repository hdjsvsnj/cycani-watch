name: zto-watch

on:
  schedule:
    - cron: "7,27,47 * * * *"
  workflow_dispatch:
    inputs:
      test_mail:
        description: "填 1 则发一封测试邮件"
        required: false
        default: "0"

permissions:
  contents: write

concurrency:
  group: zto-watch
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 查询签收状态
        env:
          KD100_CUSTOMER: ${{ secrets.KD100_CUSTOMER }}
          KD100_KEY: ${{ secrets.KD100_KEY }}
          ZTO_WAYBILL: ${{ secrets.ZTO_WAYBILL }}
          ZTO_PHONE: ${{ secrets.ZTO_PHONE }}
          SMTP_USER: ${{ secrets.CYCANI_SMTP_USER }}
          SMTP_PASS: ${{ secrets.CYCANI_SMTP_PASS }}
          MAIL_TO: ${{ secrets.CYCANI_MAIL_TO }}
          TEST_MAIL: ${{ github.event.inputs.test_mail || '0' }}
        run: python3 zto/zto_watch.py

      - name: 提交状态文件
        if: always()
        run: |
          git config user.name "anich-bot"
          git config user.email "bot@users.noreply.github.com"
          git add zto/track_cache.json zto/delivered.json 2>/dev/null || true
          if ! git diff --quiet --cached; then
            git commit -m "chore: zto track state"
            git push
          fi
